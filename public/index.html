<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dotty – Carrier lookup and cross-check</title>
<meta name="description" content="Look up a carrier by DOT, MC or name and see FMCSA trust signals: authority status, stale filings, shared phones and addresses.">
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
</head>
<body>
<header class="bar"><div class="bar-in">
  <button class="brand" id="brand" type="button" title="Start over">Dotty</button>
  <form id="f">
    <input id="q" type="search" placeholder="DOT, MC, name, phone, or email" autocomplete="off" aria-label="Carrier search" autofocus>
    <select id="t" aria-label="Search type">
      <option value="auto">Auto</option>
      <option value="dot">DOT</option>
      <option value="mc">MC</option>
      <option value="name">Name</option>
      <option value="phone">Phone</option>
      <option value="email">Email</option>
      <option value="address">Address</option>
      <option value="ca">CA number</option>
    </select>
    <button class="primary" id="go" type="submit">Search</button>
  </form>
  <div id="tools"></div>
</div>
  <button class="strip" id="strip" type="button" aria-label="Back to top of result"></button>
</header>
<main>
  <h1>Dotty</h1>
  <p class="sub">Look up a carrier and cross-check it against the FMCSA census.</p>
  <div id="out" aria-live="polite"></div>
</main>

<script src="/app.js"></script>
</body>
</html>
