<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dotty – Carrier lookup and cross-check</title>
<meta name="description" content="Look up a carrier by DOT, MC or name and see FMCSA trust signals: authority status, stale filings, shared phones and addresses.">
<style>
  :root {
    --bg: #f6f5f1; --card: #fff; --ink: #1c1d1f; --muted: #6a6d73; --line: #e3e1da; --accent: #1f5f4a;
    --high: #b3261e; --high-bg: #fbe9e7; --med: #8a5a00; --med-bg: #fdf1d8;
    --low: #4a5568; --low-bg: #edf0f3; --ok: #1f5f4a; --ok-bg: #e4f1ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141513; --card: #1d1f1c; --ink: #ecebe6; --muted: #9a9d94; --line: #2e312c; --accent: #6fc3a3;
      --high: #ff8a80; --high-bg: #3a1f1c; --med: #f0c36a; --med-bg: #362c12;
      --low: #aab4c2; --low-bg: #252a30; --ok: #6fc3a3; --ok-bg: #19302a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, button { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 10px 12px; }
  input[type=search] { flex: 1 1 240px; min-width: 0; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
  .head h2 { margin: 0; font-size: 22px; }
  .head .dba { color: var(--muted); }
  .ids { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; background: var(--low-bg); color: var(--low); }
  .chip.A { background: var(--ok-bg); color: var(--ok); }
  .chip.I { background: var(--high-bg); color: var(--high); }
  .level { padding: 14px 16px; border-radius: 12px; margin-top: 16px; border: 1px solid transparent; }
  .level b { display: block; font-size: 18px; }
  .level.high { background: var(--high-bg); color: var(--high); }
  .level.medium { background: var(--med-bg); color: var(--med); }
  .level.low { background: var(--low-bg); color: var(--low); }
  .level.clear { background: var(--ok-bg); color: var(--ok); }
  .level span { color: var(--ink); opacity: .8; font-size: 14px; }
  .sig { border-top: 1px solid var(--line); padding: 12px 0; }
  .sig:first-child { border-top: 0; padding-top: 0; }
  .sig h3 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .sev { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 6px; }
  .sev.high { background: var(--high-bg); color: var(--high); }
  .sev.medium { background: var(--med-bg); color: var(--med); }
  .sev.low, .sev.info { background: var(--low-bg); color: var(--low); }
  .sig p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  ul.ev { list-style: none; padding: 0; margin: 8px 0 0; }
  ul.ev li { padding: 4px 0; font-size: 14px; }
  button.link { background: none; border: 0; padding: 0; color: var(--accent); text-align: left; cursor: pointer; text-decoration: underline; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 15px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .fine { color: var(--muted); font-size: 13px; margin-top: 16px; }
  .err { color: var(--high); }
  ul.matches { list-style: none; padding: 0; margin: 0; }
  ul.matches li { padding: 10px 0; border-top: 1px solid var(--line); }
  ul.matches li:first-child { border-top: 0; }
</style>
</head>
<body>
<main>
  <h1>Dotty</h1>
  <p class="sub">Look up a carrier and cross-check it against the FMCSA census.</p>

  <form id="f">
    <input id="q" type="search" placeholder="DOT number, MC number, or company name" autocomplete="off" aria-label="Carrier search" autofocus>
    <select id="t" aria-label="Search type">
      <option value="auto">Auto</option>
      <option value="dot">DOT</option>
      <option value="mc">MC</option>
      <option value="name">Name</option>
    </select>
    <button class="primary" id="go" type="submit">Search</button>
  </form>

  <div id="out" aria-live="polite"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

const LEVELS = {
  high:   ['Needs review', 'At least one high-severity signal. These are trust signals, not fraud findings.'],
  medium: ['Check the details', 'Some signals worth a closer look before approving.'],
  low:    ['Minor notes', 'Only low-severity observations.'],
  clear:  ['No flags in FMCSA public data', 'That does not mean the carrier is safe. Verify insurance and identity independently.'],
};
const STATUS_WORD = { A: 'Active', I: 'Inactive', P: 'Pending' };

function carrierLine(e) {
  const bits = [e.name, `DOT ${e.dot}`, e.mc, e.location, STATUS_WORD[e.status] || e.status].filter(Boolean);
  return bits.join(' · ');
}

function evidence(list) {
  const shown = list.slice(0, 8);
  return h('ul', { class: 'ev' },
    shown.map((e) => h('li', {}, h('button', { class: 'link', type: 'button', onclick: () => run(String(e.dot), 'dot') }, carrierLine(e)))),
    list.length > shown.length ? h('li', { class: 'fine' }, `and ${list.length - shown.length} more`) : null);
}

function signal(s) {
  return h('div', { class: 'sig' },
    h('h3', {}, h('span', { class: 'sev ' + s.severity }, s.severity), s.title),
    s.detail ? h('p', {}, s.detail) : null,
    s.evidence ? evidence(s.evidence) : null);
}

function row(label, value) {
  return value == null || value === '' ? null : [h('dt', {}, label), h('dd', {}, value)];
}

function renderCarrier(d) {
  const c = d.carrier;
  const [title, blurb] = LEVELS[d.level];
  const mcs = c.dockets.map((x) => x.prefix + x.number + (x.status && x.status !== 'A' ? ` (${x.statusLabel})` : ''));
  const live = d.live;
  return [
    h('div', { class: 'card head' },
      h('h2', {}, c.legalName),
      c.dbaName ? h('div', { class: 'dba' }, 'DBA ' + c.dbaName) : null,
      h('div', { class: 'ids' },
        h('span', { class: 'chip ' + c.status }, c.statusLabel),
        h('span', { class: 'chip' }, 'DOT ' + c.dot),
        c.dockets.map((x) => h('span', { class: 'chip ' + (x.status || '') }, x.prefix + x.number)))),
    h('div', { class: 'level ' + d.level }, h('b', {}, title), h('span', {}, blurb)),
    h('div', { class: 'card' },
      d.signals.length ? d.signals.map(signal) : h('p', { class: 'fine' }, 'No signals to report.')),
    h('div', { class: 'card' },
      h('dl', {},
        row('Address', c.address),
        row('Phone', c.phone),
        row('Authority', mcs.join(', ')),
        row('Power units', c.powerUnits),
        row('Drivers', c.drivers),
        row('Last MCS-150 update', c.mcs150Date),
        row('Safety rating', c.safetyRating ? c.safetyRating + (c.safetyRatingDate ? ` (${c.safetyRatingDate})` : '') : null),
        row('Operation', c.operation),
        live ? row('Crashes (live FMCSA)', live.crashTotal) : null,
        live ? row('Vehicle OOS rate', live.vehicleOosRate != null ? live.vehicleOosRate + '%' : null) : null,
        live ? row('Driver OOS rate', live.driverOosRate != null ? live.driverOosRate + '%' : null) : null)),
    h('p', { class: 'fine' },
      'Source: FMCSA Company Census File, refreshed daily from a database about 24 hours old. ',
      d.meta.liveFmcsa === 'ok' ? 'Live FMCSA authority check included. ' : 'Live FMCSA authority check not included. ',
      d.meta.crossRefErrors.length ? `Some cross-checks failed (${d.meta.crossRefErrors.join(', ')}); results may be incomplete. ` : '',
      'Registration data is self-reported and can lag reality.'),
  ];
}

function renderList(d) {
  if (!d.matches.length) return h('div', { class: 'card' }, `No carriers matched "${d.query}".`);
  return h('div', { class: 'card' },
    h('p', { class: 'fine' }, `${d.matches.length}${d.matches.length === 25 ? '+' : ''} matches. Pick one:`),
    h('ul', { class: 'matches' }, d.matches.map((m) =>
      h('li', {}, h('button', { class: 'link', type: 'button', onclick: () => run(String(m.dot), 'dot') }, carrierLine(m))))));
}

async function run(q, type) {
  $('#q').value = q;
  $('#t').value = type || 'auto';
  const go = $('#go');
  go.disabled = true;
  const out = $('#out');
  out.replaceChildren(h('p', { class: 'fine' }, 'Searching…'));
  try {
    const res = await fetch('/api/lookup?q=' + encodeURIComponent(q) + '&type=' + encodeURIComponent(type || 'auto'));
    const d = await res.json();
    if (!res.ok) { out.replaceChildren(h('div', { class: 'card err' }, d.error || 'Something went wrong.')); return; }
    out.replaceChildren(...[].concat(d.mode === 'list' ? renderList(d) : renderCarrier(d)));
    const u = new URL(location.href);
    u.searchParams.set('q', q);
    u.searchParams.set('type', type || 'auto');
    history.replaceState(null, '', u);
  } catch {
    out.replaceChildren(h('div', { class: 'card err' }, 'Network error. Try again.'));
  } finally {
    go.disabled = false;
  }
}

$('#f').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (q) run(q, $('#t').value);
});

const init = new URL(location.href).searchParams;
if (init.get('q')) run(init.get('q'), init.get('type') || 'auto');
</script>
</body>
</html>
