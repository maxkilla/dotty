name = "dotty"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Secrets (never commit):
#   wrangler secret put FMCSA_WEB_KEY        # QCMobile webKey (optional; enables live authority/insurance checks)
#   wrangler secret put SOCRATA_APP_TOKEN    # optional; only needed if Census queries get throttled
# For local dev put the same names in .dev.vars
